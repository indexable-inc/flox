# This canary proves seed promotion and warm forking end to end for its ix
# lineage. It cannot prove the platform's fork-PR refusal: that requires a real
# fork PR and is a platform-side test tracked in the control plane.
name: "CI canary (ix)"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Load-bearing: ix promotes a lineage's seed only from a green default-branch
  # push run. Without this trigger, scheduled canaries cold-boot forever.
  push:
    branches: ["ix", "main"]

permissions: {}

jobs:
  canary:
    name: "Promotion and warmth"
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository }}
    # The second label gives this canary an independent seed lineage.
    runs-on: ["ix", "arm64", "ix-flox", "ix-canary"]
    timeout-minutes: 15

    steps:
      - name: "Probe seed warmth"
        id: warmth
        shell: "bash"
        run: |
          set -euo pipefail
          marker="$HOME/.ix-canary/last-green"

          if [[ -f "$marker" ]]; then
            verdict="WARM"
            warm="true"
            previous_marker="$(<"$marker")"
            marker_sha="$(sed -n 's/^sha=//p' "$marker")"
            marker_epoch="$(sed -n 's/^epoch=//p' "$marker")"
          else
            verdict="COLD"
            warm="false"
            previous_marker="<none>"
            marker_sha=""
            marker_epoch=""
          fi

          {
            echo "## ix canary warmth"
            echo
            echo "- Verdict: \`$verdict\`"
            echo "- Runner: \`${RUNNER_NAME:-<unset>}\`"
            echo
            echo "Previous marker:"
            echo '```text'
            printf '%s\n' "$previous_marker"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "warm=$warm"
            echo "marker_sha=$marker_sha"
            echo "marker_epoch=$marker_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: "Enforce the warmth contract"
        shell: "bash"
        env:
          EVENT_NAME: "${{ github.event_name }}"
          WARM: "${{ steps.warmth.outputs.warm }}"
          MARKER_SHA: "${{ steps.warmth.outputs.marker_sha }}"
          MARKER_EPOCH: "${{ steps.warmth.outputs.marker_epoch }}"
          HEAD_SHA: "${{ github.sha }}"
          # Only a green default-branch push run gets promoted, so only that
          # event is allowed to boot cold: a cold run anywhere else is a
          # promotion failure, not a bootstrap.
          CAN_PROMOTE: "${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}"
        run: |
          set -euo pipefail

          if [[ "$WARM" != "true" ]]; then
            if [[ "$CAN_PROMOTE" == "true" ]]; then
              echo "::notice title=Cold ix canary bootstrap::This default-branch push can promote; a green finish seeds the lineage."
              exit 0
            fi
            echo "::error title=Cold ix canary cannot promote::No promoted seed exists for the ix-canary lineage, and a $EVENT_NAME run cannot create one."
            printf '%s\n' \
              "Only a green default-branch push run is promoted to the seed." \
              "Push any commit to the default branch and let it go green; then" \
              "dispatch this canary again, which must come up WARM." \
              "If promotion is genuinely broken, escalate to the ix platform." \
              "Do not add a workflow workaround."
            exit 1
          fi

          # A warm marker missing sha or epoch is malformed (there is no
          # legacy format to tolerate: markers and this check ship together).
          # A run that can promote proceeds, because its green finish rewrites
          # the marker, which is the malformed state's only leaver; a run that
          # cannot promote fails closed rather than skip enforcement or
          # fabricate an age from epoch zero.
          if [[ -z "$MARKER_SHA" || -z "$MARKER_EPOCH" ]]; then
            if [[ "$CAN_PROMOTE" == "true" ]]; then
              echo "::warning title=Malformed warmth marker::Marker lacks sha or epoch; this run's green finish rewrites it."
              exit 0
            fi
            echo "::error title=Malformed warmth marker::Marker lacks sha or epoch; freshness cannot be enforced and will not be skipped."
            printf '%s\n' \
              "Push any commit to the default branch: its green run rewrites" \
              "the marker and promotes. If this recurs, the writer and this" \
              "reader have diverged; fix the workflow, not the marker."
            exit 1
          fi

          # Warm scheduled runs also prove promotion is CURRENT, not merely
          # that it worked once: schedule runs execute at the default-branch
          # head, so a marker recording an older sha means the newer push
          # either went red or its green run was not promoted. The age grace
          # covers the race with a push-triggered canary still in flight.
          if [[ "$EVENT_NAME" == "schedule" && "$MARKER_SHA" != "$HEAD_SHA" ]]; then
            now_epoch="$(date -u +%s)"
            age=$(( now_epoch - MARKER_EPOCH ))
            if (( age > 7200 )); then
              echo "::error title=Promoted seed is behind the default branch::Marker sha $MARKER_SHA, head $HEAD_SHA, marker age ${age}s."
              printf '%s\n' \
                "The default branch moved but the seed still carries an older" \
                "green marker: the newer push run went red, or its green run" \
                "was not promoted. Check the latest push-triggered canary run;" \
                "if it was green and this still fires, promotion is broken:" \
                "escalate to the ix platform. Do not add a workflow workaround." \
                "(A marker younger than 2h passes: the push run may still be" \
                "in flight; the next scheduled run re-checks.)"
              exit 1
            fi
            echo "::notice title=Promotion grace::Marker is behind head but only ${age}s old; allowing one promotion cycle."
          fi

      # A warm disk alone is insufficient; exercise the Nix client and evaluator
      # used by the real lanes before allowing this run to refresh the marker.
      - name: "Exercise Nix"
        shell: "bash"
        run: |
          set -euo pipefail
          nix --version
          result="$(nix eval --expr '1 + 1')"
          [[ "$result" == "2" ]]

      - name: "Record the green run"
        # Explicit success gating documents that a red run must not refresh the
        # state inherited by a future fork.
        if: ${{ success() }}
        shell: "bash"
        env:
          EVENT_NAME: "${{ github.event_name }}"
          RUN_ID: "${{ github.run_id }}"
          HEAD_SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ix-canary"
          printf 'run_id=%s\nevent=%s\nsha=%s\nepoch=%s\ntimestamp=%s\n' \
            "$RUN_ID" \
            "$EVENT_NAME" \
            "$HEAD_SHA" \
            "$(date -u +%s)" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$HOME/.ix-canary/last-green"
