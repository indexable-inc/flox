name: "CI"

on:
  workflow_dispatch:
    inputs:
      enableUpterm:
        description: "Enable the Upterm server for debugging workflows in-flight"
        required: true
        default: false
        type: boolean
      breakOnJob:
        description: "Break on a specific job, to be used with the `enableUpterm` input"
        required: false
        type: choice
        options:
          - "nix-plugins-dev"
          - "cli-unit"
          - "nix-build"
          - "trigger-flox-installers-workflow"
          - "report-failure"
          - "nix-build-bats-tests"
      allowedUptermUsers:
        description: "Comma-separated list of GitHub users allowed to access the Upterm server"
        required: false
        type: string
        default: "bryanhonof,tomberek,garbas"
  push:
    branches:
      - "main"
      # The fork's default branch is `ix`, so `main` stays a clean mirror of
      # upstream. ix promotes seeds only from green default-branch pushes.
      - "ix"
    tags:
      - "*"
  pull_request:
  merge_group:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

env:
  # Also set in setup_suite.bash but set here for consistency
  FLOX_DISABLE_METRICS: "true"
  # "true" when this run is part of cutting a release, i.e. the PR from a
  # `release-*` branch to `main`, or a PR backporting into a `release-*`
  # branch.  Some invariants only hold once `VERSION` has been bumped, which
  # happens on the release branch; tests assert those only when this is set.
  # `head_ref`/`base_ref` are empty outside `pull_request`, so pushes to `main`
  # and tag pushes correctly yield "false".
  FLOX_RUNNING_RELEASE: "${{ startsWith(github.head_ref, 'release-') || startsWith(github.base_ref, 'release-') }}"

  # Same-repository Linux jobs use the ARM64 ix pool. Fork pull requests stay
  # on GitHub-hosted runners because their code is untrusted.
  ON_IX: "${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository }}"

jobs:
  # Classify the change under test so the expensive jobs below can no-op on
  # changes that cannot possibly affect them — most importantly, so that a
  # documentation-only pull request does not occupy the shared remote Darwin
  # builders.
  #
  # This job is deliberately *not* a gate. Nothing below is skipped at the job
  # level on the strength of its output: every required check still runs and
  # still posts a status, and only the steps inside those jobs are gated.
  #
  # That is not a precaution against a hypothetical — it is a verified property
  # of this repository. A job-level skip does not post the per-leg contexts the
  # branch protection requires: on fork PR #4488, skipping `nix-build` at the
  # job level produced exactly one check run named `Nix build`, with no matrix
  # suffix and zero per-leg contexts; all four `Nix build (<system>)` contexts
  # on that commit came from the separate community-ci run. 14 of the 16
  # contexts in the `Main ruleset` are matrix legs owned by the four jobs gated
  # here, so a job-level skip does not leave a required context pending — it
  # means the context is never *created*, and the merge queue ejects the pull
  # request on a status-check timeout.
  scope:
    name: "Scope"
    # This classifier only reads the checkout and is part of every PR. Keep it
    # on the ARM64 ix fleet so a hosted-runner outage cannot prevent the ix
    # lanes from evaluating their normal scope.
    runs-on: ["ix", "arm64", "ix-flox", "ix-scope"]
    timeout-minutes: 10

    # Only `pull_request` and `merge_group` can be scoped down at all; the
    # classifier's first act on any other event is to emit the constant
    # `heavy=true`. Skipping the job outright on those events is safe under this
    # design's own rule — a skipped `scope` yields `heavy == ''`, which
    # satisfies every `!= 'false'` step condition below — and it keeps a
    # transient `scope` failure on `main` from satisfying `failure()` in
    # `report-failure` and paging Slack.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

    permissions:
      contents: read

    outputs:
      heavy: "${{ steps.classify.outputs.heavy }}"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # `git merge-base` needs history on both sides of the comparison, so
          # the depth has to stay: a shallow clone makes `merge-base` fail,
          # which lands on `heavy=true` and turns this into a silent no-op gate.
          fetch-depth: 0
          # The classifier reads path names and commit topology, never file
          # contents, so the ~36 MiB of blobs across ~5800 commits is pure cost
          # on the critical path of four jobs. `blob:none` rather than `tree:0`
          # because `actions/checkout` materialises a working tree, and `tree:0`
          # would force that back out as on-demand tree fetches.
          filter: "blob:none"

      - name: "Verify the classifier"
        # Canary, not a test suite: a pull request that widens the allowlist
        # necessarily edits `classify-ci-scope.sh`, which is itself always
        # heavy, so this runs against the change that could break it. Keeping
        # `GITHUB_OUTPUT`/`GITHUB_STEP_SUMMARY` empty stops the canary writing
        # a verdict into either.
        env:
          GITHUB_OUTPUT: ""
          GITHUB_STEP_SUMMARY: ""
        run: |
          printf 'cli/flox/src/main.rs\n' |
            ./.github/scripts/classify-ci-scope.sh --classify-only |
            grep -qx 'heavy=true'
          printf 'README.md\ndocs/guide.md\n' |
            ./.github/scripts/classify-ci-scope.sh --classify-only |
            grep -qx 'heavy=false'
          printf 'cli/flox/doc/manifest.toml.md\n' |
            ./.github/scripts/classify-ci-scope.sh --classify-only |
            grep -qx 'heavy=true'

      - name: "Classify the diff"
        id: "classify"
        # Context values are passed via `env:` and referenced as shell
        # variables rather than interpolated directly into `run:`, to avoid
        # script injection from attacker-controlled values such as branch names.
        env:
          MERGE_GROUP_BASE_SHA: "${{ github.event.merge_group.base_sha }}"
          PR_BASE_REF: "${{ github.base_ref }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: ./.github/scripts/classify-ci-scope.sh

  nix-plugins-dev:
    name: "Nix Plugins"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && fromJSON('["ix","arm64","ix-flox","ix-cpu-32","ix-nix-plugins"]')) || matrix.os }}
    # The first ix run is a real cold build. Once the lane has a seed, warm
    # runs finish well below this ceiling; the larger limit prevents a cold
    # promotion from being killed before it can establish that seed.
    timeout-minutes: 180

    needs:
      - "scope"

    # See `scope`: this job always runs, and only its steps are gated. The step
    # conditions below default to running whenever `scope` did not explicitly
    # report `heavy=false`, which covers a failed or skipped `scope`.
    #
    # Default-branch pushes must run this lane: ix promotes its green machine
    # into the lane's seed, and a skipped push would leave the lineage cold.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-22.04-8core"

    env:
      NIX_BUILD_CORES: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '0' }}"
      CARGO_BUILD_JOBS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '' }}"
      NEXTEST_TEST_THREADS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '' }}"
      RUST_TEST_THREADS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '' }}"

      __NIXOS_SET_ENVIRONMENT_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '1') || '' }}"
      __ETC_PROFILE_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '1') || '' }}"

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' && !(((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core') }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"

      - name: "Setup (ix)"
        if: ${{ needs.scope.outputs.heavy != 'false' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' }}
        uses: "./.github/actions/ix-setup"

      - name: "Build"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        run: nix develop -L --no-update-lock-file --command just build-nix-plugins

      - name: "Test"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        run: nix develop -L --no-update-lock-file --command just test-nix-plugins

  nef-dev:
    name: "Nix expression tests"
    # Default-branch pushes refresh this lane's ix seed.
    if: ${{ !cancelled() }}
    runs-on: ${{ ((((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["ix","arm64","ix-flox","ix-cpu-32","ix-nef"]')) || 'ubuntu-22.04-8core' }}
    # The first ix run still has to materialize the Flox devshell. Warm runs
    # are short, but a cold seed must have the same bootstrap budget as the
    # build lanes or it can never promote.
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      NIX_BUILD_CORES: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && '32') || '0' }}"
      CARGO_BUILD_JOBS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && '32') || '' }}"
      NEXTEST_TEST_THREADS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && '32') || '' }}"
      RUST_TEST_THREADS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && '32') || '' }}"

      __NIXOS_SET_ENVIRONMENT_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && '1') || '' }}"
      __ETC_PROFILE_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && '1') || '' }}"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ !((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"

      - name: "Setup (ix)"
        if: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: "./.github/actions/ix-setup"

      - name: "Test NEF"
        run: nix develop -L --no-update-lock-file --command just test-nef

      - name: "Test buildenvLib"
        run: nix develop -L --no-update-lock-file --command just test-buildenvLib

  cli-unit:
    name: "unit"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && fromJSON('["ix","arm64","ix-flox","ix-cpu-32","ix-cli-unit"]')) || matrix.os }}
    timeout-minutes: 180

    needs:
      - "scope"

    # See `nix-plugins-dev`: always runs, only its steps are gated.
    #
    # Unlike `nix-plugins-dev`/`nef-dev`, this job is NOT job-skipped on push
    # to main: the "Build" step below writes the Cargo cache, and caches are
    # only ever refreshed by the branch that ran them. Skipping the whole job
    # on main would leave every new PR branch without a warm cache to restore
    # via `restore-keys`. Only the "CLI Unit Tests" and "Check schemas" steps
    # (the actually-redundant parts, already covered by the merge queue) are
    # skipped on push to main below.
    if: ${{ !cancelled() }}

    permissions:
      contents: read
      id-token: write # Needed for CodeCov

    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-22.04-8core"

    env:
      NIX_BUILD_CORES: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '0' }}"
      CARGO_BUILD_JOBS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '' }}"
      NEXTEST_TEST_THREADS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '' }}"
      RUST_TEST_THREADS: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '32') || '' }}"

      __NIXOS_SET_ENVIRONMENT_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '1') || '' }}"
      __ETC_PROFILE_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' && '1') || '' }}"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' && !(((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core') }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"

      - name: "Setup (ix)"
        if: ${{ needs.scope.outputs.heavy != 'false' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core' }}
        uses: "./.github/actions/ix-setup"

      - name: "Cache Cargo"
        if: ${{ needs.scope.outputs.heavy != 'false' && !(((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'ubuntu-22.04-8core') }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: "cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: "cargo-${{ runner.os }}-"

      - name: "Build"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        run: nix develop -L --no-update-lock-file --command just build-cli

      - name: "CLI Unit Tests"
        # Upstream validates pushes in its merge queue. The IX fork runs the
        # tests on default-branch pushes too, so its seed includes test builds.
        id: unit-tests
        if: ${{ needs.scope.outputs.heavy != 'false' && !(github.repository == 'flox/flox' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
        env:
          RUST_BACKTRACE: 1
          IMPURE_TESTS_EXTRA_ARGS: "--no-fail-fast"
        run: |
          export TMPDIR="$RUNNER_TEMP"
          nix develop -L --no-update-lock-file --command just impure-tests

      - name: "Check schemas are up to date"
        # Keep the fork's seed-building push equivalent to its measured repeat.
        if: ${{ needs.scope.outputs.heavy != 'false' && !(github.repository == 'flox/flox' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
        run: |
          nix develop -L --no-update-lock-file --command just gen-schemas
          if ! git diff --quiet cli/schemas; then
            echo "::error::Schema files are not up to date. Please run 'just gen-schemas' and commit the changes."
            git status
            git diff
            exit 1
          fi

  nix-build:
    name: "Nix build"
    # Fork PRs can't access the AWS OIDC / Tailscale secrets this job needs, so
    # it can only fail. The required "Nix build (*)" contexts are posted on the
    # same commit by the maintainer-run community-ci draft PR (CONTRIBUTING.md).
    # Pushes, merge-queue runs, and same-repo PRs are unaffected.
    #
    # See `scope`: `!cancelled()` keeps the pre-existing fork condition as the
    # *only* reason this job is ever skipped.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && fromJSON('["ix","arm64","ix-flox","ix-cpu-32","ix-nix-build"]')) || 'ubuntu-latest' }}
    timeout-minutes: 180

    needs:
      - "scope"

    permissions:
      contents: read
      id-token: write # Needed for AWS Creds

    env:
      IX_LEG: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux') }}"
      NIX_BUILD_CORES: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '32') || '0' }}"

      __NIXOS_SET_ENVIRONMENT_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '1') || '' }}"
      __ETC_PROFILE_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '1') || '' }}"

    strategy:
      fail-fast: false
      matrix:
        system:
          - "aarch64-linux"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        # needed for git describe to work
        with:
          fetch-depth: 0

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          TAILSCALE_URL: "${{ vars.MANAGED_TAILSCALE_URL }}"
          TAILSCALE_AUTH_KEY: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          REMOTE_BUILDERS: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          SYSTEM: "${{ matrix.system }}"
          SETUP_NIX: "false"

      - name: "Setup (ix)"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG == 'true' }}
        uses: "./.github/actions/ix-setup"

      - name: "Configure AWS Credentials"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: "arn:aws:iam::759020684799:role/github-oidc-role-flox-cache-public"
          role-session-name: "${{ github.run_id }}"
          aws-region: "us-east-1"
          output-env-credentials: true
          unset-current-credentials: true

      - name: "Build"
        id: "build"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        env:
          # S3 on purpose, not R2: this is the destination the builders
          # publish the product closures to, and cache.flox.dev serves them
          # from there to users, flox-installers, and the bats test builders.
          NIX_SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_S3_BUCKET }}"
          NIX_SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
        run: |
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY
          export AWS_SESSION_TOKEN
          export NIX_SUBSTITUTER_KEY

          for package in 'checks.${{ matrix.system }}.ca-roots' 'packages.${{ matrix.system }}.flox-nix-plugins' 'packages.${{ matrix.system }}.flox-cli' 'packages.${{ matrix.system }}.flox' 'packages.${{ matrix.system }}.flox-cli-tests'; do
            echo "::group::Building $package"
            ./.github/scripts/remote-execute-nix-build.sh "$package" "$NIX_SUBSTITUTER"
            echo "::endgroup::"
          done

      - name: "Build (ix, local)"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG == 'true' }}
        env:
          NIX_SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_S3_BUCKET }}"
          NIX_SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
        run: |
          for package in 'checks.${{ matrix.system }}.dev-tool-cache' 'packages.${{ matrix.system }}.flox-nix-plugins' 'packages.${{ matrix.system }}.flox-cli' 'packages.${{ matrix.system }}.flox' 'packages.${{ matrix.system }}.flox-cli-tests'; do
            echo "::group::Building $package"
            ./.github/scripts/ix-local-nix-build.sh "$package" "$NIX_SUBSTITUTER"
            echo "::endgroup::"
          done

  nix-build-crate2nix:
    name: "crate2nix build"
    # Builds the crate2nix packages the same way `nix-build` builds the crane
    # ones, so the two pipelines can be compared on the same builders.
    #
    # Same fork restriction as `nix-build`: this job needs the AWS OIDC and
    # Tailscale secrets to reach the builders.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && fromJSON('["ix","arm64","ix-flox","ix-cpu-32","ix-crate2nix"]')) || 'ubuntu-latest' }}
    timeout-minutes: 180

    needs:
      - "scope"

    permissions:
      contents: read
      id-token: write # Needed for AWS Creds

    env:
      IX_LEG: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux') }}"
      NIX_BUILD_CORES: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '32') || '0' }}"

      __NIXOS_SET_ENVIRONMENT_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '1') || '' }}"
      __ETC_PROFILE_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '1') || '' }}"

    strategy:
      fail-fast: false
      matrix:
        system:
          - "aarch64-linux"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        # needed for git describe to work
        with:
          fetch-depth: 0

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          TAILSCALE_URL: "${{ vars.MANAGED_TAILSCALE_URL }}"
          TAILSCALE_AUTH_KEY: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          REMOTE_BUILDERS: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          SYSTEM: "${{ matrix.system }}"
          SETUP_NIX: "false"

      - name: "Setup (ix)"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG == 'true' }}
        uses: "./.github/actions/ix-setup"

      - name: "Configure AWS Credentials"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: "arn:aws:iam::759020684799:role/github-oidc-role-flox-cache-public"
          role-session-name: "${{ github.run_id }}"
          aws-region: "us-east-1"
          output-env-credentials: true
          unset-current-credentials: true

      - name: "Build"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        env:
          NIX_SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_S3_BUCKET }}"
          NIX_SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
        run: |
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY
          export AWS_SESSION_TOKEN
          export NIX_SUBSTITUTER_KEY

          for package in 'packages.${{ matrix.system }}.crate2nix-flox' 'packages.${{ matrix.system }}.crate2nix-flox-activations' 'packages.${{ matrix.system }}.crate2nix-nef-lock-catalog'; do
            echo "::group::Building $package"
            ./.github/scripts/remote-execute-nix-build.sh "$package" "$NIX_SUBSTITUTER"
            echo "::endgroup::"
          done

      - name: "Build (ix, local)"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG == 'true' }}
        env:
          NIX_SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_S3_BUCKET }}"
          NIX_SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
        run: |
          for package in 'packages.${{ matrix.system }}.crate2nix-flox' 'packages.${{ matrix.system }}.crate2nix-flox-activations' 'packages.${{ matrix.system }}.crate2nix-nef-lock-catalog'; do
            echo "::group::Building $package"
            ./.github/scripts/ix-local-nix-build.sh "$package" "$NIX_SUBSTITUTER"
            echo "::endgroup::"
          done

  trigger-flox-installers-workflow:
    name: "Build installers"
    if: ${{ github.repository == 'flox/flox' && github.ref_name == github.event.repository.default_branch && github.event_name == 'push' }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 120

    needs:
      - "nix-build"

    steps:
      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Trigger flox-installers workflow"
        uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: "flox"
          repo: "flox-installers"
          github_token: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          github_user: "floxbot"
          workflow_file_name: "ci.yml"
          ref: "${{ github.ref_name }}"
          wait_interval: 10
          client_payload: '{"FLOX_SRC":"github:flox/flox/${{ github.event.pull_request.head.sha || github.sha }}"}'
          propagate_failure: true
          trigger_workflow: true
          wait_workflow: true

  report-failure:
    name: "Report Failure"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    if: ${{ failure() && github.repository == 'flox/flox' && github.ref_name == github.event.repository.default_branch && github.event_name == 'push' }}

    # All ix lanes now run on the default-branch push so their seeds can
    # refresh. Keep the notification dependencies narrow to the jobs that
    # determine the release path.
    needs:
      - "nix-build"
      - "cli-unit"

    steps:
      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Slack Notification"
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
          SLACK_CHANNEL: "#pod-workflows"
          SLACK_TITLE: "Something broke CI for flox/flox on ${{ github.ref_name }}"
          SLACK_FOOTER: "Thank you for caring"
          SLACK_WEBHOOK: "${{ secrets.MANAGED_SLACK_WEBHOOK }}"
          SLACK_USERNAME: "GitHub"
          SLACK_ICON_EMOJI: ":poop:"
          SLACK_COLOR: "#ff2800" # ferrari red -> https://encycolorpedia.com/ff2800
          SLACK_LINK_NAMES: true

  nix-build-bats-tests:
    name: "remote (${{ matrix.system }}, ${{ matrix.test-tags }})"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && matrix.ix-runner) || 'ubuntu-latest' }}
    # This lane also participates in the first seed promotion. Give a cold
    # ARM64 build the same ceiling as the other ix lanes.
    timeout-minutes: 180

    permissions:
      contents: read
      id-token: write # Needed for CodeCov

    env:
      IX_LEG: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux') }}"
      NIX_BUILD_CORES: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '32') || '0' }}"

      __NIXOS_SET_ENVIRONMENT_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '1') || '' }}"
      __ETC_PROFILE_DONE: "${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && matrix.system == 'aarch64-linux' && '1') || '' }}"

    needs:
      - "scope"

    # Each ARM64 ix VM builds its own flox-cli-tests closure with nix run.
    # The separate build job publishes no outputs on this fork and remains
    # an independent workflow check. Keep its same-repository trust guard.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - system: "aarch64-linux"
            test-tags: "containerize"
            ix-runner: ["ix", "arm64", "ix-flox", "ix-cpu-32", "ix-bats-containerize"]
          - system: "aarch64-linux"
            test-tags: "!containerize"
            ix-runner: ["ix", "arm64", "ix-flox", "ix-cpu-32", "ix-bats"]

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          TAILSCALE_URL: "${{ vars.MANAGED_TAILSCALE_URL }}"
          TAILSCALE_AUTH_KEY: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          REMOTE_BUILDERS: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          SYSTEM: "${{ matrix.system }}"

      - name: "Setup (ix)"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG == 'true' }}
        uses: "./.github/actions/ix-setup"

      - name: "Run Bats Tests (./#flox-cli-tests)"
        timeout-minutes: 30
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG != 'true' }}
        env:
          MATRIX_SYSTEM: ${{ matrix.system }}
          MATRIX_TEST_TAGS: ${{ matrix.test-tags }}
        run: ./.github/scripts/remote-execute-integration-tests.sh

      - name: "Prepare rootless containers (ix)"
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG == 'true' && matrix.test-tags == 'containerize' }}
        run: |
          set -euo pipefail
          # OCI guests have no udev rule to grant access to the devtmpfs TUN
          # node. Podman's rootless network helper needs to open this device.
          test -c /dev/net/tun
          sudo -n chmod 0666 /dev/net/tun
          test -r /dev/net/tun && test -w /dev/net/tun

      - name: "Run Bats Tests (ix, local)"
        timeout-minutes: 45
        if: ${{ needs.scope.outputs.heavy != 'false' && env.IX_LEG == 'true' }}
        env:
          MATRIX_SYSTEM: ${{ matrix.system }}
          MATRIX_TEST_TAGS: ${{ matrix.test-tags }}
        run: ./.github/scripts/ix-local-integration-tests.sh
