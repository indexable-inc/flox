# ============================================================================ #
#
# Run `pre-commit` over the codebase.
#
# ---------------------------------------------------------------------------- #

name: "Project Lints"
on:
  pull_request:
  merge_group:
  push:
    branches: ["ix"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

env:
  FLOX_DISABLE_METRICS: "true"
  ON_IX: "${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository }}"

jobs:
  nix-git-hooks:
    name: "Nix Git Hooks"
    # Default-branch warmups seed ix-lints without changing upstream triggers.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.repository == 'indexable-inc/flox' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["ix","arm64","ix-lints"]')) || 'ubuntu-latest' }}
    # 30 -> 60: `pre-commit run` shells out to the devshell, and a cold ix
    # machine realises that closure first.
    timeout-minutes: 60

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # SKIPPED on ix; see the note on the same step in ci.yml.
      - name: "Setup Nix"
        if: ${{ env.ON_IX != 'true' }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"

      - name: "Setup Nix (ix)"
        if: ${{ env.ON_IX == 'true' }}
        uses: "./.github/actions/ix-setup"

      - name: "Determine target branch ( PR )"
        if: ${{ github.event_name == 'pull_request' }}
        # Unlike `github.event.merge_group.base_ref`, `github.base_ref`
        # only includes the final ref name; prepend `refs/heads/` to match
        # the format of `github.event.merge_group.base_ref`.
        #
        # The PR head branch may live in a fork, so it is not guaranteed to
        # exist on `origin`. Fetch it through `refs/pull/<number>/head`, which
        # GitHub maintains on the base repo for every PR (fork or same-repo).
        #
        # Context values are passed via `env:` and referenced as shell
        # variables rather than interpolated directly into `run:`, to avoid
        # script injection from attacker-controlled values such as branch names.
        env:
          BASE_REF: "${{ github.base_ref }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          echo "TARGET_REF=refs/heads/${BASE_REF}" >> "$GITHUB_ENV";
          echo "HEAD_REF=refs/pull/${PR_NUMBER}/head" >> "$GITHUB_ENV";

      - name: "Fetch target branch ( Merge Queue )"
        if: ${{ github.event_name == 'merge_group' }}
        env:
          MERGE_GROUP_BASE_REF: "${{ github.event.merge_group.base_ref }}"
          MERGE_GROUP_HEAD_REF: "${{ github.event.merge_group.head_ref }}"
        run: |
          echo "TARGET_REF=${MERGE_GROUP_BASE_REF}" >> "$GITHUB_ENV";
          echo "HEAD_REF=${MERGE_GROUP_HEAD_REF}" >> "$GITHUB_ENV";

      - name: "Set merge queue flag"
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          echo 'IS_MERGE_QUEUE=1' >> "$GITHUB_ENV";

      # Fetch the head and target branch and create a local reference to it.
      # Apparently git does not like fetching into the current branch,
      # so we fetch into temporary branches `target` and `head`.
      - name: "Fetch branches"
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        run: |
          git fetch --atomic origin \
            "$TARGET_REF:target" \
            "$HEAD_REF:head";

      # avoid the next step being filled with nix substitution logs
      # and ensure that `pre-commit` can run cargo with the `--offline` flag
      - name: "Fetch rust dependencies"
        run: |
          nix develop -L --no-update-lock-file --command \
            cargo fetch \
            --manifest-path ./Cargo.toml \
            --locked;

      # PRs and merge groups check their diff. Warmups check every file so the
      # promoted seed carries Rust dependencies and the Clippy build state.
      - name: "Run Nix Git Hooks"
        env:
          EVENT_NAME: "${{ github.event_name }}"
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|merge_group)
              selection=(--from-ref "$(git rev-parse target)" --to-ref "$(git rev-parse head)")
              ;;
            push|workflow_dispatch)
              selection=(--all-files)
              ;;
            *)
              echo "Unsupported lint event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          nix develop -L --no-update-lock-file --command \
            pre-commit run \
              --verbose \
              --show-diff-on-failure \
              --hook-stage manual \
              "${selection[@]}";

# ---------------------------------------------------------------------------- #
